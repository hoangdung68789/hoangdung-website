<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d0f">
<title>Quản trị · Hoàng Dũng Real Estate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121417'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='%23e9a27a' text-anchor='middle'%3EHD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#121417;--ink2:#434951;--mut:#6f7680;--line:#e6e8eb;--night:#0c0d0f;--night2:#16181b;--gold:#e9a27a;--gold2:#c97a52;--ok:#2f9e6b;--warn:#c98a1b;--bad:#c2463d;--blue:#3b6fd8;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;font-size:14.5px;white-space:nowrap;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;transform:none;cursor:default}
.btn.gold{background:linear-gradient(90deg,#f3c9a3,var(--gold));color:#1a120c}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.danger{background:var(--bad)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,162,122,.2)}
label.f{display:grid;gap:6px;font-size:13.5px;color:var(--ink2);font-weight:500}
.err{color:var(--bad);font-size:14px;min-height:18px}

/* ---- màn đăng nhập ---- */
.gate{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60% 50% at 20% 10%,rgba(233,162,122,.18),transparent 70%),radial-gradient(50% 40% at 90% 90%,rgba(120,160,230,.12),transparent 70%),var(--night)}
.gate-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:30px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:7px}
.brand small{font-size:12.5px;letter-spacing:.18em;font-weight:600;color:var(--gold2)}
.gate h1{font-size:22px;margin:18px 0 4px;letter-spacing:-.02em}
.gate p.lead{margin:0 0 18px;color:var(--ink2)}
.gate form{display:grid;gap:14px}
.gate .btn{height:44px;width:100%}
.gate .foot{margin-top:16px;font-size:13px;color:var(--mut);text-align:center}

/* ---- khung ứng dụng ---- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%;background:linear-gradient(90deg,var(--night) 240px,transparent 240px)}
.side{background:var(--night);color:#e9eaec;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.side .brand{color:#fff;padding:0 8px;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.1}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#b9bec5;text-align:left;font-size:14.5px;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(233,162,122,.14);color:#fff}
.nav button.on svg{color:var(--gold)}
.nav svg{width:18px;height:18px;flex:none}
.nav .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:#1a120c;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.side .me{margin-top:auto;padding:12px;border-radius:12px;background:var(--night2);font-size:13.5px;color:#b9bec5}
.side .me b{display:block;color:#fff;font-weight:600}
.side .me .row{display:flex;gap:8px;margin-top:10px}
.side .me button,.side .me a{flex:1;height:32px;border-radius:8px;background:rgba(255,255,255,.07);color:#e9eaec;font-size:13px;display:grid;place-items:center;text-decoration:none}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:0;font-size:24px;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--ink2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .in{width:auto;min-width:220px;height:38px;padding:0 14px;border-radius:999px}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line),0 10px 30px -22px rgba(18,20,23,.3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px}
.kpi span{font-size:13.5px;color:var(--ink2)}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:13px;color:var(--mut)}
.kpi.hot b{color:var(--gold2)}
.chart{padding:18px 18px 12px}
.chart h3{margin:0 0 14px;font-size:15px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:140px}
.bar{position:relative;background:linear-gradient(180deg,#f3c9a3,var(--gold));border-radius:6px 6px 2px 2px;min-height:3px}
.bar em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:12.5px;color:var(--ink2)}
.blabels{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:6px;font-size:12.5px;white-space:nowrap;color:var(--mut);text-align:center}
.note{padding:14px 16px;border-radius:12px;background:#fff7f0;color:#7a4a2b;font-size:14px;line-height:1.6;margin-top:18px}
.note.ok{background:#eef8f2;color:#245c40}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.who b{display:block;font-weight:600}
.who span{color:var(--mut);font-size:13.5px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-new{background:#fff1e6;color:#b4572a}.t-contacted{background:#e9f0ff;color:#2f57b0}.t-deal{background:#fdf4d8;color:#8a6510}.t-closed{background:#e7f6ee;color:#23744e}.t-spam{background:#f1f1f1;color:#777}
.t-active{background:#e7f6ee;color:#23744e}.t-disabled{background:#fdeceb;color:#a3352d}.t-ver{background:#e9f0ff;color:#2f57b0}
.msg{max-width:420px;white-space:pre-wrap;color:var(--ink2);font-size:14px;max-height:66px;overflow:hidden;position:relative;cursor:pointer}
.msg.open{max-height:none}
.msg:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,#fff)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.more{display:flex;justify-content:center;padding:14px}
.lead-note{margin-top:8px;display:flex;gap:6px}
.lead-note .in{min-height:36px;padding:7px 10px;font-size:14px;resize:vertical}
select.st{border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#fff;font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.pad{padding:20px}
.pad h3{margin:0 0 4px;font-size:16px}
.pad p.d{margin:0 0 16px;color:var(--ink2);font-size:14px}
.pad form{display:grid;gap:12px}
code{background:#f3f4f6;padding:2px 6px;border-radius:6px;font-size:13.5px}

/* hộp thoại */
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,15,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.dlg-in{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--ink2)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.temp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:12px;background:#121417;color:#fff;font-size:22px;letter-spacing:.06em;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);animation:pop .25s}

/* điện thoại */
.mbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;padding:10px 12px;gap:10px;flex-direction:column;min-width:0}
  .side>.brand{display:none}
  .mbar .brand{flex-direction:row;align-items:baseline;padding:0}
  .mbar{display:flex;align-items:center;justify-content:space-between;color:#fff}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:8px 12px;white-space:nowrap}
  .nav svg{display:none}
  .side .me{display:none}
  .main{padding-top:20px}
  .tools .in{min-width:0;flex:1 1 180px}
  /* bảng → thẻ */
  table.rsp thead{display:none}
  table.rsp tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.rsp td{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:10px;padding:5px 0;border:0}
  table.rsp td>*{grid-column:2}
  table.rsp td::before{content:attr(data-l);grid-column:1;grid-row:1/span 6;font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px}.kpi b{font-size:26px}
  .msg{max-width:none}
  .app{background:none}
}
@media (max-width:640px){.blabels span:nth-child(even){visibility:hidden}.bars{gap:3px}.blabels{gap:3px}}

/* hồ sơ khách + yêu cầu cập nhật */
.dlg-in.wide{max-width:780px;max-height:min(92vh,960px);overflow:auto}
.dl{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 16px;margin:0 0 16px;font-size:14.5px}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:500;word-break:break-word}
.sec-t{margin:18px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.ev{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ev small{color:var(--mut)}
.t-pending{background:#fff1e6;color:#b4572a}.t-done{background:#e7f6ee;color:#23744e}.t-rejected{background:#f1f1f1;color:#666}.t-lock{background:#efeaf9;color:#5b3fa3}
.req-msg{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);margin-top:6px;max-width:520px}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}

/* ===== v16: vai trò quản trị — chữ 3D có màu ===== */
.rb{--a:#ffe2b8;--b:#e9a27a;--c:#c97a52;--d:#6a3518;--e:#2a160a;--g1:#3d2817;--g2:#1c120a;--bd:rgba(233,162,122,.55);display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 12px 0 9px;border-radius:999px;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.10),transparent 60%),linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 0 0 1px var(--bd),inset 0 1px 0 rgba(255,255,255,.14),0 3px 8px -3px rgba(0,0,0,.45);vertical-align:middle;white-space:nowrap;line-height:1;flex:none}
.rb-manager{--a:#cfe3ff;--b:#8fbfe4;--c:#3b6fd8;--d:#13306e;--e:#07142f;--g1:#1a2944;--g2:#0a1325;--bd:rgba(143,191,228,.55)}
.rb-assistant{--a:#c9f2dc;--b:#5fcf97;--c:#2f9e6b;--d:#0f4a2f;--e:#052014;--g1:#163728;--g2:#0a1d14;--bd:rgba(95,207,151,.55)}
.rb svg{width:14px;height:14px;flex:none;color:var(--b);filter:drop-shadow(0 1px 0 var(--d)) drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.rbt{display:inline-grid;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.rbt>*{grid-area:1/1;font-style:normal;font-weight:inherit;white-space:nowrap;padding:.32em 0 .12em;margin:-.32em 0 -.12em}
.rbt i{color:var(--d);text-shadow:0 1px 0 var(--d),0 2px 0 var(--e),0 3px 3px rgba(0,0,0,.55)}
.rbt b{color:transparent;background:linear-gradient(180deg,var(--a) 8%,var(--b) 52%,var(--c) 96%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 -.5px 0 rgba(255,255,255,.18))}
.rb.lg{height:31px;padding:0 14px 0 11px;gap:7px}.rb.lg .rbt{font-size:13.5px}.rb.lg svg{width:16px;height:16px}
.side .me .rb{margin:7px 0 5px}
.side .me .em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mbar .r{display:flex;align-items:center;gap:8px}
@media (max-width:420px){.mbar .brand small{display:none}.mbar .rb{height:25px;padding:0 9px 0 7px}.mbar .rb svg{display:none}}

/* chung */
.mut{color:var(--mut)}.sm{font-size:13px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.dz{color:var(--bad);box-shadow:inset 0 0 0 1px #f0c9c5}
.btn.on{background:linear-gradient(90deg,#f3c9a3,var(--gold));color:#1a120c;box-shadow:none}
label.ck{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);font-weight:500;cursor:pointer}
label.ck input{width:18px;height:18px;accent-color:var(--gold2)}
label.f small{font-weight:400;color:var(--mut);font-size:12.5px}
.kpi.link{cursor:pointer;text-align:left;width:100%;transition:transform .2s,box-shadow .2s}.kpi.link:hover{transform:translateY(-2px)}
.perm{display:grid;gap:7px;margin:0;padding:0;list-style:none;font-size:14px}
.perm li{display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.perm li::before{content:"✓";color:var(--ok);font-weight:800;width:14px;flex:none}
.perm li.no{color:#9aa0a8}.perm li.no::before{content:"✕";color:#c5c9ce;font-weight:600}
.rl{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}.rl:first-of-type{border-top:0;padding-top:4px}
.rl p{margin:0;font-size:14px;color:var(--ink2)}.rl>.rb{justify-self:start}
.pv{gap:5px;background:#f1f3f5;color:var(--ink2);margin:2px 4px 2px 0}
.pv i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:800;color:#fff;line-height:1}
.pv-google i{background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}.pv-facebook i{background:#1877f2}
.t-creator{background:linear-gradient(90deg,#fff0de,#ffe1c7);color:#94491d}.t-crp{background:#fff6dc;color:#8a6510}
.t-published{background:#e7f6ee;color:#23744e}.t-draft{background:#eef0f2;color:#555b63}.t-hidden{background:#f1f1f1;color:#666}.t-sold{background:#efeaf9;color:#5b3fa3}
.t-ban{background:#fff1e6;color:#a4501f}.t-thue{background:#e9f0ff;color:#2f57b0}
.t-approved{background:#e7f6ee;color:#23744e}.t-feat{background:#fdf4d8;color:#8a6510}
.okt{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
tr.fail td{background:#fff6f5}
.st-role{max-width:100%}
.cpy{display:flex;gap:8px;align-items:center;margin:8px 0}.cpy code{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.5;padding:6px 9px}
.box-t{font-size:14px;line-height:1.75;color:var(--ink2)}

/* tin đăng */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr));gap:16px}
.lc{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lc .ph{position:relative;aspect-ratio:16/10;background:#e9ebee;overflow:hidden;flex:none}
.lc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lc .ph>.tag{position:absolute;left:10px;top:10px;box-shadow:0 2px 8px -2px rgba(0,0,0,.25)}
.lc .ph .cnt{position:absolute;left:10px;bottom:10px;height:24px;padding:0 9px;border-radius:999px;background:rgba(12,13,15,.62);color:#fff;font-size:12.5px;display:grid;place-items:center}
.fav{position:absolute;right:10px;top:10px;height:30px;padding:0 11px;border-radius:999px;background:rgba(12,13,15,.62);color:#fff;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s}
.fav:hover{background:rgba(12,13,15,.8)}
.fav.on{background:linear-gradient(90deg,#f8dcc0,var(--gold));color:#1a120c}
.lc .lb{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.lc h4{margin:0;font-size:15.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc .pr{font-size:19px;font-weight:700;color:var(--gold2);letter-spacing:-.01em}
.mt{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.lc .acts{padding-top:6px;align-self:end}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;min-height:60px;border-radius:12px;transition:box-shadow .2s}
.imgs.drop{box-shadow:0 0 0 2px var(--gold)}
.imgs-empty{grid-column:1/-1;padding:22px 14px;border:1.5px dashed #d5d9de;border-radius:12px;text-align:center;color:var(--mut);font-size:14px}
.im{position:relative;border-radius:12px;overflow:hidden;background:#eef0f2;aspect-ratio:4/3;cursor:grab;box-shadow:inset 0 0 0 1px var(--line)}
.im img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.im .cv{position:absolute;left:6px;top:6px;height:22px;padding:0 8px;border-radius:999px;background:linear-gradient(90deg,#f8dcc0,var(--gold));color:#1a120c;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.im .ib{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:flex-end}
.im .ib button{width:30px;height:30px;border-radius:8px;background:rgba(12,13,15,.72);color:#fff;font-size:14px;display:grid;place-items:center}
.im .ib button:disabled{opacity:.35;cursor:default}
.im .ib button[data-rm]{background:rgba(194,70,61,.9)}
.im.drag{opacity:.4}.im.over{box-shadow:0 0 0 3px var(--gold)}
.prog{height:6px;border-radius:99px;background:#eef0f2;overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3c9a3,var(--gold2));transition:width .25s}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
.pick button{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;box-shadow:inset 0 0 0 1px var(--line);background:#ddd}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:12.5px;text-align:left}
.pick button[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold)}
.pick button[aria-pressed=true]::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a120c;font-weight:800;display:grid;place-items:center;font-size:13px}
.hint{font-size:13px;color:var(--ok);font-weight:600;min-height:20px}
.dlg .row.l{justify-content:flex-start;align-items:center}

/* creator */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.cc{padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.cc .hd{display:flex;gap:12px;align-items:center;min-width:0}
.cc .hd .who{min-width:0;flex:1}.cc .hd .who b,.cc .hd .who span{overflow:hidden;text-overflow:ellipsis}
.av{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;background:linear-gradient(135deg,#f3c9a3,var(--gold2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px}
.cc .cov{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:12px;display:block}
.links{display:flex;gap:6px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:13.5px;text-decoration:none;font-weight:500;color:var(--ink)}
.lk:hover{background:#e6e8eb}
.lk-tiktok::before,.lk-youtube::before,.lk-facebook::before,.lk-video::before{content:"";width:8px;height:8px;border-radius:50%;background:#121417}
.lk-youtube::before{background:#e62117}.lk-facebook::before{background:#1877f2}.lk-video::before{background:var(--gold2)}
.cc .intro{margin:0;font-size:14px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.cc .ctc{font-size:13.5px;color:var(--ink2);word-break:break-word}
.cvp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.cvp img{width:180px;max-width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:#eee}

/* lượt truy cập */
.ana{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:18px}
.hb{display:grid;gap:12px}
.hb .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}
.hb .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r em{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.hb .r .b{grid-column:1/-1;height:6px;border-radius:99px;background:#eef0f2;overflow:hidden}
.hb .r .b i{display:block;height:100%;border-radius:99px;background:#c97a52}
.lgd{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.lgd span{display:inline-flex;align-items:center;gap:7px}
.lgd .sw{width:12px;height:12px;border-radius:3px;background:#c97a52}.lgd .ln{width:16px;height:3px;border-radius:2px;background:#3b6fd8}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.chart-wrap text{font-family:var(--font);font-size:12.5px;fill:#6f7680}
.chart-wrap .hit{fill:transparent}.chart-wrap .hit:hover{fill:rgba(18,20,23,.05)}
.chart-empty{position:absolute;inset:0 0 30px 40px;display:grid;place-items:center;color:var(--mut);font-size:14px;pointer-events:none}
details.tbl{margin-top:10px;font-size:14px}details.tbl summary{cursor:pointer;color:var(--ink2);padding:4px 0}
details.tbl .tw{max-height:300px;overflow:auto;margin-top:6px}
details.tbl td,details.tbl th{padding:7px 10px}

/* thiết bị đăng nhập */
.sess .s{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.sess .s:first-child{border-top:0}
.sess .s>div{min-width:0}.sess .s small{display:block;color:var(--mut);font-size:13px;word-break:break-word}
.t-alert{background:#fdeceb;color:#a3352d;box-shadow:inset 0 0 0 1px #f3c4bf}
tr.alert td{background:#fff8f7}tr.alert td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
</style>
</head>

/* ảnh: nén trên trình duyệt (cạnh dài ≤1600px, WebP 0.82 → JPEG 0.85, giảm tiếp nếu >1,2MB) rồi gửi base64 */
async function decodeImage(file) {

async function compressImage(file) {

function listingEdit(l) {

/* ---------- lượt truy cập ---------- */
let AD = 30;
async function analytics() {
  const m = $('#main');
  m.innerHTML = `<div class="top"><div><h2>Lượt truy cập</h2><p>Số người xem website, nguồn truy cập và tin được mở nhiều nhất.</p></div>
    <div class="chips" role="group" aria-label="Khoảng thời gian">${[7, 30, 90].map(n => `<button class="chip ${AD === n ? 'on' : ''}" data-d="${n}" aria-pressed="${AD === n}">${n} ngày</button>`).join('')}</div></div>
  <div id="an"><div class="empty">Đang tải…</div></div>`;
  $$('.chip', m).forEach(c => c.onclick = () => { AD = +c.dataset.d; analytics(); });
  let a; try { a = await api('analytics?days=' + AD); } catch (e) { $('#an').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  const el = $('#an'); if (!el || S.view !== 'analytics') return;
  /* đủ mọi ngày từ since đến hôm nay, ngày thiếu = 0 */
  const map = Object.fromEntries((a.daily || []).map(r => [r.day, r])), days = [];
  const t0 = Date.parse((a.since || '') + 'T00:00:00Z') || (Date.now() - (AD - 1) * 864e5);
  for (let i = 0; i < (a.days || AD); i++) { const k = new Date(t0 + i * 864e5).toISOString().slice(0, 10); const r = map[k] || {}; days.push({ day: k, views: Number(r.views) || 0, visitors: Number(r.visitors) || 0 }); }

  const refHost = r => { try { return new URL(/^https?:/.test(r) ? r : 'https://' + r).hostname.replace(/^www\./, ''); } catch (e) { return r; } };

/* biểu đồ SVG: cột = lượt xem, đường = khách */
function dayChart(days, W) {
  W = Math.max(280, Math.round(W)); const H = W < 520 ? 210 : 250, pl = 38, pr = 8, pt = 14, pb = 28, cw = W - pl - pr, ch = H - pt - pb, n = days.length;
  const mx = Math.max(1, ...days.map(d => Math.max(d.views, d.visitors))), step = Math.pow(10, Math.floor(Math.log10(mx))), nice = [1, 2, 2.5, 5, 10].map(k => k * step).find(v => mx / v <= 4) || mx, top = Math.ceil(mx / nice) * nice;
  const x = i => pl + (i + .5) * cw / n, y = v => pt + ch - v / top * ch, bw = Math.max(2, Math.min(28, cw / n * .62));
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += nice) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e8eb" ${v ? 'stroke-dasharray="3 4"' : ''}/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${numVi(v)}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.floor(cw / 46)));
  const bars = days.map((d, i) => `<rect x="${x(i) - bw / 2}" y="${y(d.views)}" width="${bw}" height="${Math.max(0, pt + ch - y(d.views))}" rx="${Math.min(4, bw / 3)}" fill="#c97a52" opacity=".85"/>`).join('');
  const line = days.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(d.visitors).toFixed(1)}`).join('');
  const dots = n <= 31 ? days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.visitors)}" r="3" fill="#fff" stroke="#3b6fd8" stroke-width="2"/>`).join('') : '';
  const labs = days.map((d, i) => (n - 1 - i) % every === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.day.slice(8)}/${d.day.slice(5, 7)}</text>` : '').join('');
  const hits = days.map((d, i) => `<rect class="hit" x="${pl + i * cw / n}" y="${pt}" width="${cw / n}" height="${ch}"><title>${d.day.slice(8)}/${d.day.slice(5, 7)}/${d.day.slice(0, 4)}: ${numVi(d.views)} lượt xem · ${numVi(d.visitors)} khách</title></rect>`).join('');
  const empty = days.every(d => !d.views) ? '<div class="chart-empty">Chưa có lượt truy cập trong khoảng này.</div>' : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Biểu đồ lượt xem và số khách theo ngày">${g}${bars}<path d="${line}" fill="none" stroke="#3b6fd8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}${hits}</svg>${empty}`;
}

  ['need', 'Nhu cầu chính', 0, ['Mua để ở', 'Mua đầu tư', 'Thuê nhà', 'Bán nhà', 'Cho thuê', 'Tìm hiểu thị trường']], ['budget', 'Ngân sách dự kiến', 0, ['Dưới 3 tỷ', '3 – 5 tỷ', '5 – 10 tỷ', '10 – 20 tỷ', 'Trên 20 tỷ', 'Thuê dưới 15 triệu/tháng', 'Thuê từ 15 triệu/tháng']], ['areas', 'Khu vực quan tâm'], ['contactTime', 'Thời gian liên hệ', 0, ['Giờ hành chính', 'Buổi tối (18h – 21h)', 'Cuối tuần', 'Bất kỳ lúc nào']]];

    <div class="sec-t">Tài khoản</div><dl class="dl"><dt>Tên hiển thị</dt><dd>${esc(u.name)} ${u.name_changes >= 1 ? '<span class="tag t-spam">đã tự đổi 1 lần</span>' : ''}</dd><dt>Email</dt><dd>${esc(u.email)} ${u.email_verified ? '<span class="tag t-ver">✓</span>' : '<span class="tag t-new">chưa xác minh</span>'}</dd><dt>Số điện thoại</dt><dd>${esc(u.phone)} ${u.phone_verified ? '<span class="tag t-ver">✓</span>' : '<span class="tag t-new">chưa xác minh</span>'}</dd><dt>Vai trò</dt><dd>${esc(u.role || '—')}</dd>${u.creator ? `<dt>Creator</dt><dd>${CRL[u.creator] || esc(u.creator)}</dd>` : ''}<dt>Ngày tạo</dt><dd>${fmt(u.created_at)}</dd><dt>Trạng thái</dt><dd>${u.status === 'active' ? 'Hoạt động' : 'Tạm khoá'}</dd>
    <dt>Liên kết đăng nhập</dt><dd>${ids.length ? ids.map(x => `<div>${pvTag(x.provider) || esc(x.provider)} <span class="mut sm">${esc(x.email || '')} · từ ${fmt(x.created_at)}</span></div>`).join('') : '<span class="mut">Chưa liên kết Google / Facebook</span>'}</dd>
    <dt>Mật khẩu</dt><dd>${u.has_pass === 0 ? '<span class="mut">Chưa đặt (chỉ đăng nhập bằng mạng xã hội)</span>' : 'Đã đặt'}</dd></dl>

    ${has ? `<dl class="dl">${PF.filter(([k]) => p[k]).map(([k, l, , t]) => `<dt>${l}</dt><dd>${esc(t === 'date' ? dIso(p[k]) : p[k])}</dd>`).join('')}${p.consentAt ? `<dt>Đồng ý xử lý dữ liệu</dt><dd>${fmt(Date.parse(p.consentAt))}</dd>` : ''}</dl>` : '<p>Khách chưa lưu thông tin cá nhân.</p>'}

    ${can('logins.users') ? `<div class="head-row" style="margin-top:18px"><div class="sec-t" style="margin:0">Thiết bị đang đăng nhập</div>${man ? '<button class="btn sm ghost dz" data-kick>Đăng xuất mọi thiết bị của khách</button>' : ''}</div><div id="usess"><div class="empty" style="padding:16px">Đang tải…</div></div>

}
function userEdit(u, p, requestId) {
  const field = ([k, l, req, t]) => Array.isArray(t)
    ? `<label class="f">${l}${req ? ' *' : ''}<select class="in" name="p_${k}"><option value="">—</option>${t.map(o => `<option${o === p[k] ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`
    : `<label class="f${k === 'address' || k === 'currentAddress' ? ' full' : ''}">${l}${req ? ' *' : ''}<input class="in" name="p_${k}" type="${t === 'date' ? 'date' : 'text'}" value="${esc(p[k] || '')}"${k === 'cccd' ? ' inputmode="numeric" maxlength="12"' : ''}></label>`;
  const d = dialog(`<h3>Sửa thông tin khách hàng</h3><p>Chỉ cập nhật sau khi đã xác minh đúng chủ tài khoản. Mọi thay đổi được ghi vào lịch sử.</p>
    <form id="uef" novalidate><div class="sec-t">Tài khoản</div><div class="fgrid"><label class="f">Tên hiển thị<input class="in" name="name" value="${esc(u.name)}" required></label><label class="f">Email<input class="in" name="email" type="email" value="${esc(u.email)}" required></label><label class="f">Số điện thoại (định dạng quốc tế, ví dụ +84901234567)<input class="in" name="phone" value="${esc(u.phone)}" required></label></div>
    <div class="sec-t">Thông tin cá nhân <span style="text-transform:none;letter-spacing:0;font-weight:400">(bỏ trống toàn bộ nếu khách chưa cung cấp)</span></div><div class="fgrid">${PF.map(field).join('')}</div>
    <div class="err" id="uee" style="margin-top:12px"></div><div class="row"><button type="button" class="btn ghost" data-x>Huỷ</button><button class="btn gold" type="submit">${requestId ? 'Lưu & đóng yêu cầu' : 'Lưu thay đổi'}</button></div></form>`);
  d.firstElementChild.classList.add('wide');
  $('#uef', d).onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const prof = {}; PF.forEach(([k]) => { if (f['p_' + k]) prof[k] = f['p_' + k].trim(); });
    const b = $('#uef button[type=submit]', d); b.disabled = true;
    try { await api('user', { id: u.id, action: 'update', name: f.name, email: f.email, phone: f.phone, profile: prof, requestId: requestId || undefined }); d.remove(); toast('Đã cập nhật thông tin khách hàng.'); refreshStats(); if (S.view === 'users') usersLoad(); else if (S.view === 'requests') requests(); userDetail(u.id); }
    catch (err) { $('#uee', d).textContent = err.message; b.disabled = false; }
  };
}

/* ---------- yêu cầu cập nhật thông tin (khách gửi từ trang tài khoản) ---------- */
let RQ = 'pending';
async function requests() {
  const m = $('#main');
  m.innerHTML = `<div class="top"><div><h2>Yêu cầu cập nhật thông tin</h2><p>Khách gửi khi hồ sơ đã khoá hoặc đã dùng hết lượt tự đổi tên. Gọi số đã đăng ký để xác minh trước khi sửa.</p></div></div>
  <div class="chips" style="margin-bottom:14px"><button class="chip ${RQ === 'pending' ? 'on' : ''}" data-s="pending">Chờ xử lý</button><button class="chip ${RQ === 'done' ? 'on' : ''}" data-s="done">Đã xử lý</button></div>
  <div class="card"><div class="tw" id="qt"><div class="empty">Đang tải…</div></div></div>`;
  $$('.chip').forEach(c => c.onclick = () => { RQ = c.dataset.s; requests(); });
  let rows; try { rows = (await api('requests?status=' + RQ)).rows; } catch (e) { $('#qt').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!rows.length) { $('#qt').innerHTML = `<div class="empty">${RQ === 'pending' ? 'Không có yêu cầu nào đang chờ.' : 'Chưa có yêu cầu đã xử lý.'}</div>`; return; }
  $('#qt').innerHTML = `<table class="rsp"><thead><tr><th>Thời gian</th><th>Khách</th><th>Nội dung yêu cầu</th><th>${RQ === 'pending' ? 'Thao tác' : 'Kết quả'}</th></tr></thead><tbody>${rows.map(r => `<tr data-id="${r.id}" data-uid="${r.user_id}"${r.topic === 'Cảnh báo đăng nhập lạ' ? ' class="alert"' : ''}>
    <td data-l="Thời gian"><span title="${fmt(r.created_at)}">${ago(r.created_at)}</span></td>
    <td data-l="Khách" class="who"><b>${esc(r.user_name || '—')}</b><span>${esc(r.user_email || '')}<br><a href="tel:${esc(r.user_phone || '')}">${esc(r.user_phone || '')}</a></span></td>
    <td data-l="Nội dung">${r.topic === 'Cảnh báo đăng nhập lạ' ? '<span class="tag t-alert">⚠ Cảnh báo đăng nhập lạ</span>' : `<b>${esc(r.topic)}</b>`}<div class="req-msg">${esc(r.message)}</div></td>
    <td data-l="${RQ === 'pending' ? 'Thao tác' : 'Kết quả'}">${RQ === 'pending' ? (can('requests.handle') ? '<div class="acts"><button class="btn sm gold" data-open>Mở hồ sơ & cập nhật</button><button class="btn sm ghost" data-done>Đã xử lý</button><button class="btn sm ghost" data-reject>Từ chối</button></div>' : `<div class="acts"><button class="btn sm" data-open>Xem hồ sơ</button><button class="btn sm ghost" disabled title="${NEED('Quản lý')} để xử lý yêu cầu">Xử lý</button></div>`) : `<span class="tag t-${esc(r.status)}">${r.status === 'done' ? 'Đã xử lý' : 'Từ chối'}</span><div style="font-size:13px;color:var(--mut);margin-top:4px">${fmt(r.handled_at)} · ${esc(r.handled_by)}${r.note ? '<br>' + esc(r.note) : ''}</div>`}</td></tr>`).join('')}</tbody></table>`;
  const close = async (b, status) => {
    const tr = b.closest('tr'); const dd = dialog(`<h3>${status === 'done' ? 'Đánh dấu đã xử lý' : 'Từ chối yêu cầu'}</h3><p>Ghi chú nội bộ (tuỳ chọn).</p><textarea class="in" id="rqn" rows="3" placeholder="${status === 'done' ? 'Ví dụ: đã gọi xác minh và cập nhật địa chỉ' : 'Lý do từ chối'}"></textarea><div class="row" style="margin-top:12px"><button class="btn ghost" data-x>Huỷ</button><button class="btn ${status === 'done' ? '' : 'danger'}" id="rqok">Xác nhận</button></div>`);
    $('#rqok', dd).onclick = async () => { try { await api('request', { id: +tr.dataset.id, status, note: $('#rqn', dd).value }); dd.remove(); toast('Đã cập nhật yêu cầu.'); refreshStats().then(() => shell()); } catch (e) { toast(e.message); } };
  };
  $$('[data-open]').forEach(b => b.onclick = () => { const tr = b.closest('tr'); userDetail(+tr.dataset.uid, +tr.dataset.id); });
  $$('[data-done]').forEach(b => b.onclick = () => close(b, 'done'));
  $$('[data-reject]').forEach(b => b.onclick = () => close(b, 'rejected'));
}

    <div class="sec-t">Đang đăng nhập</div><div id="mysess"><div class="empty" style="padding:16px">Đang tải…</div></div>
    <div class="sec-t">Lần đăng nhập gần đây</div><div class="tw" id="mylog"><div class="empty" style="padding:16px">Đang tải…</div></div></div></div>`;
  $('#mf').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); if (!d.pass) { $('#me').textContent = 'Vui lòng nhập mật khẩu hiện tại.'; return; } try { const j = await api('me', d); S.admin = j.admin; toast('Đã lưu thông tin tài khoản.'); shell(); } catch (err) { $('#me').textContent = err.message; } };
  $('#pf').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); if (d.pass !== d.pass2) { $('#pe').textContent = 'Hai mật khẩu mới chưa khớp.'; return; } try { await api('password', { old: d.old, pass: d.pass }); e.target.reset(); $('#pe').textContent = ''; toast('Đã đổi mật khẩu quản trị.'); loadMine(); } catch (err) { $('#pe').textContent = err.message; } };
  const loadMine = async () => {
    let L; try { L = await api('logins'); } catch (e) { const x = $('#mylog'); if (x) x.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    const ss = $('#mysess'), lg = $('#mylog'); if (!ss || !lg) return;
    ss.innerHTML = sessionList(L.sessions, true); lg.innerHTML = loginTable((L.events || []).slice(0, 20), false);
    const others = (L.sessions || []).filter(x => !x.current).length, k = $('#kickOthers'); k.hidden = !others;
    const fails = (L.events || []).slice(0, 20).filter(x => !x.ok).length;
    if (fails) lg.insertAdjacentHTML('afterbegin', `<div class="note" style="margin:0 0 10px;background:#fdeceb;color:#8a2a22">Có <b>${fails}</b> lần đăng nhập sai mật khẩu gần đây (dòng tô đỏ). Nếu không phải bạn, hãy đổi mật khẩu.</div>`);
    $$('[data-sid]', ss).forEach(b => b.onclick = async () => { b.disabled = true; try { await api('sessions', { sid: b.dataset.sid }); toast('Đã đăng xuất thiết bị.'); loadMine(); } catch (e) { toast(e.message); b.disabled = false; } });
  };
  $('#kickOthers').onclick = async () => { if (!(await confirmBox('Đăng xuất các thiết bị khác?', 'Mọi phiên đăng nhập quản trị trên thiết bị khác sẽ kết thúc. Thiết bị này vẫn giữ đăng nhập.', 'Đăng xuất', true))) return; try { await api('sessions', { others: true }); toast('Đã đăng xuất các thiết bị khác.'); loadMine(); } catch (e) { toast(e.message); } };
  loadMine();
}

/* ---------- cài đặt ---------- */
function settings() {
  const m = $('#main');
  if (!can('settings')) { m.innerHTML = `<div class="top"><div><h2>Cài đặt</h2></div></div><div class="note">Mục Cài đặt chỉ dành cho <b>Giám đốc</b>. Bạn vẫn đổi được tên, email và mật khẩu của mình ở mục <b>Tài khoản của tôi</b>.</div>`; return; }
  const on = b => b ? '<span class="tag t-active">Đã bật</span>' : '<span class="tag t-new">Chưa cấu hình</span>';
  const cb = (id, url) => `<div class="cpy"><code id="${id}">${esc(url)}</code><button type="button" class="btn sm ghost" data-cp="${id}" aria-label="Sao chép địa chỉ">Sao chép</button></div>`;
  m.innerHTML = `<div class="top"><div><h2>Cài đặt</h2><p>Gửi mã xác minh, email tự động và đăng nhập bằng mạng xã hội.</p></div></div>
  <div class="grid2"><div class="card pad"><h3>Tài khoản quản trị</h3><p class="d">Đổi tên, email đăng nhập và mật khẩu ở mục <b>Tài khoản của tôi</b>.</p><button class="btn ghost" data-go="account">Mở Tài khoản của tôi</button></div>
  <div class="card pad"><h3>Mã xác minh tự động</h3>
    <p class="d">SMS ${S.sms ? '<span class="tag t-active">Đang bật</span>' : '<span class="tag t-new">Chưa bật</span>'} · Email ${S.mail ? '<span class="tag t-active">Đang bật</span>' : '<span class="tag t-new">Chưa bật</span>'}</p>
    <div style="font-size:13px;line-height:1.75;color:var(--ink2)">Các khoá được thêm trong <b>Cloudflare → Workers &amp; Pages → hoangdung-realestate → Settings → Variables and Secrets</b> (chọn loại <b>Secret</b>), rồi bấm <b>Deploy</b>:<br>
    <b>SMS (Twilio Verify, hỗ trợ số quốc tế):</b><br>
    &nbsp;&nbsp;• <code>TWILIO_ACCOUNT_SID</code>, <code>TWILIO_AUTH_TOKEN</code> — trong trang chủ tài khoản Twilio<br>
    &nbsp;&nbsp;• <code>TWILIO_VERIFY_SID</code> — tạo dịch vụ ở Twilio → Verify → Services (bắt đầu bằng VA…)<br>
    <b>Email (miễn phí 300 thư/ngày với Brevo):</b><br>
    &nbsp;&nbsp;• <code>BREVO_API_KEY</code> — Brevo → SMTP &amp; API → API Keys<br>
    &nbsp;&nbsp;• <code>MAIL_FROM</code> — ví dụ <code>Hoàng Dũng Real Estate &lt;email-da-xac-minh@...&gt;</code><br>
    &nbsp;&nbsp;• <code>NOTIFY_EMAIL</code> — email nhận thông báo yêu cầu tư vấn mới (tuỳ chọn)</div></div>
  <div class="card pad" style="grid-column:1/-1"><h3>Đăng nhập Google / Facebook</h3>
    <p class="d">Google ${on(S.google)} · Facebook ${on(S.facebook)}</p>
    <div class="grid2">
      <div class="box-t"><b>Google</b><br>1. Vào <b>Google Cloud Console → APIs &amp; Services → Credentials</b>.<br>2. Tạo <b>OAuth client ID</b>, loại <b>Web application</b>.<br>3. Ở <b>Authorized redirect URIs</b>, dán địa chỉ:${cb('gcb', location.origin + '/api/auth/oauth/google/callback')}4. Sao chép Client ID và Client secret vào hai khoá <code>GOOGLE_CLIENT_ID</code>, <code>GOOGLE_CLIENT_SECRET</code>.</div>
      <div class="box-t"><b>Facebook</b><br>1. Vào <b>developers.facebook.com → My Apps</b>, tạo ứng dụng và thêm sản phẩm <b>Facebook Login</b>.<br>2. Ở <b>Valid OAuth Redirect URIs</b>, dán địa chỉ:${cb('fcb', location.origin + '/api/auth/oauth/facebook/callback')}3. Sao chép App ID và App Secret vào hai khoá <code>FACEBOOK_APP_ID</code>, <code>FACEBOOK_APP_SECRET</code>.</div>
    </div>
    <p class="box-t" style="margin:12px 0 0">Các khoá đặt trong <b>Cloudflare → Workers &amp; Pages → hoangdung-realestate → Settings → Variables and Secrets</b> (chọn loại <b>Secret</b>), rồi bấm <b>Deploy</b>. Khi đổi tên miền, nhớ khai báo lại hai địa chỉ trên theo tên miền mới.</p></div></div>`;
  $$('[data-cp]', m).forEach(b => b.onclick = () => copy($('#' + b.dataset.cp).textContent));
  goLinks(m);
}

/* ---------- khởi động ---------- */
function render() { if (!S.admin) gate(); else { shell(); refreshStats().then(() => { if (S.view !== 'home' && S.stats && $$('.nav .bd').length !== badgeCount()) syncBadges(); }); } }
/* cập nhật số trên menu mà không vẽ lại trang đang mở (tránh mất dữ liệu đang nhập) */
function syncBadges() {
  const b = badgeMap();
  $$('.nav button').forEach(btn => { const n = b[btn.dataset.v]; let el = $('.bd', btn); if (n) { if (!el) { el = document.createElement('span'); el.className = 'bd'; btn.appendChild(el); } el.textContent = n; el.setAttribute('aria-label', n + ' mục chờ'); } else if (el) el.remove(); });
}
(async () => {
  try { const j = await (await fetch('/api/admin/state', { cache: 'no-store', credentials: 'same-origin' })).json(); S.setup = j.setup; S.admin = j.admin; S.mail = j.mail; S.sms = j.sms; S.google = !!j.google; S.facebook = !!j.facebook; }
  catch (e) { $('#root').innerHTML = '<div class="gate"><div class="gate-card"><h1>Không kết nối được máy chủ</h1><p class="lead">Vui lòng tải lại trang sau ít phút.</p></div></div>'; return; }
  render();
})();
</script>
</body>
</html>
